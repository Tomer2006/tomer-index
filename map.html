<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map — Tomer index</title>
    <meta
      name="description"
      content="Choropleth world map of the Tomer index by country, 2000–2024, with per-country detail and history links."
    />
    <meta property="og:title" content="Map — Tomer index" />
    <meta
      property="og:description"
      content="World map of the Tomer index by country, 2000–2024."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tomer index" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="is-loading">
    <div class="page-loader" role="status">
      <span class="page-loader-mark" aria-hidden="true"></span>
      <span>Loading map…</span>
    </div>
    <div id="app" aria-busy="true">
      <header class="hero compare-page-header">
        <nav class="site-nav" aria-label="Main">
          <a href="./index.html" class="site-nav-link">Leaderboard</a>
          <a href="./compare.html" class="site-nav-link">Compare</a>
          <a href="./map.html" class="site-nav-link" aria-current="page">Map</a>
          <a href="./methodology.html" class="site-nav-link">Methodology</a>
        </nav>
        <div class="hero-row">
          <div class="hero-titles">
            <p class="kicker">World map</p>
            <h1>Tomer index by country</h1>
          </div>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
      </header>

      <main class="map-page">
        <section class="map-controls" aria-label="Map controls">
          <label class="year-control">
            <span class="control-label">Year</span>
            <input type="range" id="map-year-slider" min="2000" max="2024" step="1" value="2024" />
            <output id="map-year-output" class="year-output">2024</output>
          </label>
          <label class="search-control map-search-control">
            <span class="control-label">Find a country</span>
            <input
              type="search"
              id="map-search"
              list="map-search-list"
              placeholder="Country or ISO code…"
              autocomplete="off"
            />
            <datalist id="map-search-list"></datalist>
          </label>
          <div class="map-legend" id="map-legend" aria-label="Color legend"></div>
          <fieldset class="map-weight-controls">
            <legend class="control-label">Map weights</legend>
            <div class="map-weight-grid">
              <label><span>Health <output data-weight-output="health">40%</output></span><input type="range" min="0" max="100" step="1" value="40" data-map-weight="health" /></label>
              <label><span>Safety <output data-weight-output="safety">30%</output></span><input type="range" min="0" max="100" step="1" value="30" data-map-weight="safety" /></label>
              <label><span>Freedom <output data-weight-output="freedom">20%</output></span><input type="range" min="0" max="100" step="1" value="20" data-map-weight="freedom" /></label>
              <label><span>Abundance <output data-weight-output="abundance">10%</output></span><input type="range" min="0" max="100" step="1" value="10" data-map-weight="abundance" /></label>
            </div>
            <div class="map-weight-footer">
              <span id="map-weight-note" class="muted">Normalized to 100%</span>
              <button type="button" id="map-weight-reset" class="btn">Reset weights</button>
            </div>
          </fieldset>
        </section>
        <div class="map-wrap">
          <div id="map-svg" class="map-svg" role="img" aria-label="Choropleth world map of Tomer index"></div>
          <div id="map-tooltip" class="map-tooltip" hidden></div>
        </div>
        <aside id="map-detail" class="map-detail-panel" aria-live="polite">
          <p class="map-detail-empty">Select a country on the map.</p>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/map.js"></script>
  </body>
</html>
