<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomer index</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <nav class="site-nav" aria-label="Main">
          <a href="./index.html" class="site-nav-link" aria-current="page">Leaderboard</a>
          <a href="./compare.html" class="site-nav-link">Compare</a>
        </nav>
        <div class="hero-row">
          <div class="hero-titles">
            <p class="kicker">Leaderboard</p>
            <h1>Tomer index</h1>
          </div>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
      </header>

      <section class="global-series" aria-labelledby="global-series-h">
        <h2 id="global-series-h" class="global-series-title">Global average Tomer index over time</h2>
        <div id="global-series-chart" class="global-series-chart" role="img" aria-label="Line chart of global average Tomer index by year"></div>
      </section>

      <main>
        <div class="table-wrap">
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="tomer">
                    <span class="th-sort-label">Rank</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="name">
                    <span class="th-sort-label">Place</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="le">
                    <span class="th-sort-label">Life exp.</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="hale">
                    <span class="th-sort-label">HALE</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="gni">
                    <span class="th-sort-label">GNI pc (PPP)</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="homicides">
                    <span class="th-sort-label">Homicides /100k</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="tomer">
                    <span class="th-sort-label">Tomer index</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
