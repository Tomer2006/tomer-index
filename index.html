<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomer index</title>
    <meta
      name="description"
      content="Tomer index — abundance, safety, health, and freedom for every country, 2000–2024. Interactive leaderboard, world map, and country comparisons."
    />
    <meta property="og:title" content="Tomer index" />
    <meta
      property="og:description"
      content="A composite of abundance, safety, health, and freedom for every country, 2000–2024."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tomer index" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="is-loading">
    <div class="page-loader" role="status">
      <span class="page-loader-mark" aria-hidden="true"></span>
      <span>Loading Tomer index…</span>
    </div>
    <div id="app" aria-busy="true">
      <header class="hero">
        <nav class="site-nav" aria-label="Main">
          <a href="./index.html" class="site-nav-link" aria-current="page">Leaderboard</a>
          <a href="./compare.html" class="site-nav-link">Compare</a>
          <a href="./map.html" class="site-nav-link">Map</a>
          <a href="./methodology.html" class="site-nav-link">Methodology</a>
        </nav>
        <div class="hero-row">
          <div class="hero-titles">
            <p class="kicker">Leaderboard</p>
            <h1>Tomer index</h1>
            <p class="hero-pillars">Abundance · Safety · Health · Freedom</p>
          </div>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
      </header>

      <main>
        <section class="leaderboard-controls" aria-label="Leaderboard filters">
          <div class="control-row">
            <label class="year-control">
              <span class="control-label">Year</span>
              <input type="range" id="year-slider" min="2000" max="2024" step="1" />
              <output id="year-output" class="year-output">2024</output>
            </label>
            <label class="search-control">
              <span class="control-label">Search</span>
              <input type="search" id="search-input" placeholder="Country, region, group…" autocomplete="off" />
            </label>
            <label class="toggle-control">
              <input type="checkbox" id="include-aggregates" checked />
              <span>Include aggregates</span>
            </label>
          </div>
          <div class="control-row">
            <fieldset class="filter-chips" id="type-filter">
              <legend class="control-label">Type</legend>
              <div class="chips" data-filter-key="type"></div>
            </fieldset>
            <fieldset class="filter-chips" id="region-filter">
              <legend class="control-label">Region</legend>
              <div class="chips" data-filter-key="region"></div>
            </fieldset>
            <fieldset class="filter-chips" id="income-filter">
              <legend class="control-label">Income</legend>
              <div class="chips" data-filter-key="income"></div>
            </fieldset>
            <button type="button" id="filter-reset" class="btn filter-reset">Reset</button>
          </div>
          <div class="control-row">
            <fieldset class="filter-chips data-quality-filter" id="quality-filter">
              <legend class="control-label">Data quality</legend>
              <div class="chips">
                <button type="button" class="chip is-active" data-quality="all">All</button>
                <button type="button" class="chip" data-quality="complete">Complete</button>
                <button type="button" class="chip" data-quality="incomplete">Incomplete</button>
              </div>
            </fieldset>
            <p class="data-quality-note">
              <span class="data-quality-badge">Incomplete data</span>
              means at least one yearly point is missing an index input. Hover or tap a badge for details.
            </p>
          </div>
        </section>
        <div class="table-wrap">
          <table class="leaderboard-table">
            <thead>
              <tr>
                <th scope="col">Rank</th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="name">
                    <span class="th-sort-label">Place</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="le">
                    <span class="th-sort-label">Life exp.</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="hale">
                    <span class="th-sort-label">HALE</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="health">
                    <span class="th-sort-label">Health</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="gni">
                    <span class="th-sort-label">Abundance (income pc)</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="homicides">
                    <span class="th-sort-label">Homicides /100k</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="freedom">
                    <span class="th-sort-label">Freedom</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="th-sort" data-sort="tomer">
                    <span class="th-sort-label">Tomer index</span><span class="th-sort-icon" aria-hidden="true"></span>
                  </button>
                </th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="leaderboard-cards" class="leaderboard-cards"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
