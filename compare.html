<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compare — Tomer index</title>
    <meta
      name="description"
      content="Compare countries side by side on the Tomer index: health, income, and safety pillars, plus per-metric charts over time."
    />
    <meta property="og:title" content="Compare — Tomer index" />
    <meta
      property="og:description"
      content="Compare countries side by side on health, income, and safety."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tomer index" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="hero compare-page-header">
        <nav class="site-nav" aria-label="Main">
          <a href="./index.html" class="site-nav-link">Leaderboard</a>
          <a href="./compare.html" class="site-nav-link" aria-current="page">Compare</a>
          <a href="./map.html" class="site-nav-link">Map</a>
          <a href="./methodology.html" class="site-nav-link">Methodology</a>
        </nav>
        <div class="hero-row">
          <div class="hero-titles">
            <p class="kicker">Tomer index</p>
            <h1>Compare countries</h1>
          </div>
          <div id="scale-control" class="scale-control-wrap"></div>
        </div>
        <p id="status" class="status" aria-live="polite"></p>

        <section class="compare-panel compare-panel-page" aria-labelledby="compare-heading">
          <h2 id="compare-heading" class="visually-hidden">Side-by-side comparison</h2>
          <div class="compare-toolbar">
            <label class="year-control compare-year-control">
              <span class="control-label">Year</span>
              <input type="range" id="compare-year-slider" min="2000" max="2023" step="1" value="2023" />
              <output id="compare-year-output" class="year-output">2023</output>
            </label>
            <fieldset class="filter-chips compare-presets">
              <legend class="control-label">Quick add</legend>
              <div class="chips" id="compare-preset-chips"></div>
            </fieldset>
          </div>
          <div id="compare-selected-chips" class="compare-selected-chips" aria-label="Selected entries"></div>
          <div id="compare-picks" class="compare-picks" role="group" aria-label="Countries to compare"></div>
          <div class="compare-actions">
            <button type="button" id="btn-add" class="btn primary">+ Add country</button>
            <button type="button" id="btn-clear" class="btn">Clear</button>
          </div>
          <div id="compare-out" class="compare-out" aria-live="polite"></div>
        </section>
      </header>
    </div>
    <script type="module" src="/src/compare.js"></script>
  </body>
</html>
